<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f8f9">
    <title>DYE Web</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Describe Your Espresso</p>
          <h1>DYE Web</h1>
        </div>
        <div class="top-actions">
          <button class="secondary-button refresh-button" id="refreshButton" type="button">Refresh</button>
        </div>
      </header>

      <section class="controls" aria-label="Shot controls">
        <div class="segmented" role="tablist" aria-label="View">
          <button id="historyTab" class="segment active" type="button" role="tab" aria-selected="true">History</button>
          <button id="nextTab" class="segment" type="button" role="tab" aria-selected="false">Next Shot</button>
        </div>
        <label class="search-wrap">
          <span>Search</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Beans, profile, grinder, notes">
        </label>
      </section>

      <main class="workspace">
        <section class="shot-list-panel" aria-label="Shot history">
          <div class="list-meta">
            <span id="shotCount">0 shots</span>
            <span id="connectionState">Connecting</span>
          </div>
          <div class="shot-list" id="shotList"></div>
        </section>

        <section class="detail-panel" aria-live="polite">
          <div class="shot-hero">
            <div class="shot-title-block">
              <p class="eyebrow" id="selectedDate">Select a shot</p>
              <h2 id="selectedTitle">Shot history</h2>
              <p id="selectedSubtitle" class="subtitle">Your saved Decent espresso shots will appear here.</p>
            </div>
            <button id="editButton" class="primary-button" type="button" disabled>Saved</button>
          </div>

          <div class="metrics-strip" id="metricsStrip"></div>

          <div class="chart-band">
            <canvas id="shotChart" aria-label="Shot chart"></canvas>
            <div class="chart-legend" id="chartLegend"></div>
          </div>

          <div class="metadata-grid" id="metadataGrid"></div>
        </section>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
